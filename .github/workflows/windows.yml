name: windows

on:
  push:
    branches: [main, windows-app]
    tags: ["v*"]
    paths: ["server/**", "windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["server/**", "windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: windows/requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r windows/requirements-build.txt
      - name: Server tests
        working-directory: server
        run: python -B -m unittest discover -s tests -q
      - name: Windows app tests
        working-directory: windows
        run: python -B -m unittest discover -s tests -t . -q
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build exe, portable zip and installer
        shell: pwsh
        run: ./windows/build.ps1 -SkipTests
      - name: Smoke test (version)
        shell: pwsh
        run: |
          $p = Start-Process windows/dist/MarstekVenusMonitor/MarstekVenusMonitor.exe -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: MarstekVenusMonitor-windows
          path: |
            windows/dist/*.zip
            windows/dist/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MarstekVenusMonitor-windows
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
